[package]
name = "tacitus"
version = "0.1.0"
description = "Replay-corpus manager for Command & Conquer 3: Kane's Wrath"
authors = ["Bertrand Quenin"]
edition = "2021"
license = "MIT"
repository = "https://github.com/bquenin/tacitus"

[lib]
name = "tacitus_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
anyhow = "1"
chrono = { version = "0.4", features = ["serde"] }
hex = "0.4"
sha2 = "0.10"
rusqlite = { version = "0.32", features = ["bundled", "chrono"] }
walkdir = "2"
