[package]
name = "silo"
version = "0.1.0"
description = "Replay-corpus manager for Command & Conquer 3: Kane's Wrath"
authors = ["Bertrand Quenin"]
edition = "2021"
license = "MIT"
repository = "https://github.com/bquenin/silo"
default-run = "silo"

[lib]
name = "silo_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
portable = []

[build-dependencies]
tauri-build = { version = "2", features = [] }
serde_json = "1"
sha2 = "0.10"

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-single-instance = "2.4.5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
anyhow = "1"
chrono = { version = "0.4", features = ["serde"] }
hex = "0.4"
sha2 = "0.10"
rusqlite = { version = "0.32", features = ["bundled", "chrono"] }
walkdir = "2"
dunce = "1"
regex = "1"
reqwest = { version = "0.13", default-features = false, features = ["rustls"] }
tempfile = "3"
tokio = { version = "1", features = ["rt", "time", "macros"] }
zip = { version = "8", default-features = false, features = ["deflate-flate2-zlib-rs"] }
lzma-rust2 = { version = "0.20", default-features = false, features = ["std"] }
flate2 = { version = "1", default-features = false, features = ["zlib-rs"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Diagnostics_ToolHelp", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }
winreg = "0.56.0"

# Historical packs expand to several GiB; keep decompression usable in dev.
[profile.dev.package.lzma-rust2]
opt-level = 3

# The streaming decoder is generic and is instantiated in this crate.
[profile.dev.package.silo]
opt-level = 1

[profile.dev.package.sha2]
opt-level = 3

[profile.dev.package.zlib-rs]
opt-level = 3
